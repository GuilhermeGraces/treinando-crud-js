<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-4">
        <h1>Formulário de cadastro</h1>
        <form id="formulario">

            <div class="mt-3">
                <label for="userid">ID do usuário</label>
                <input type="number" class="form-control" id="userid">
            </div>
            <div class="mt-3">
                <label for="titulo">Título</label>
                <input type="text" class="form-control" id="titulo">
            </div>
            <button type="submit" class="btn btn-primary mt-3">Enviar</button>
        </form>
        <div class="d-none alert" id="alerta"></div>
        <pre class="bg-dark text-white mt-3 p-3 rounded" id="saida"></pre>

        <h1>edição</h1>

        <div class="container mt-4">
            <h2>id conteudo</h2>
            <input type="number" id="idBusca" class="form-control">
            <button type="submit" class="btn btn-secondary" id="btnCarregar">Procurar</button>
            <button type="submit" class="btn btn-danger" id="btnExcluir">Excluir</button>
        </div>

        <form id="formEditar">
            <div class="mt-3">
                <label for="tituloEditar">Titulo</label>
                <input type="text" class="form-control" id="tituloEdit">
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

</body>

</html>
